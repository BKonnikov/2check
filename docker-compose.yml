name: 2check

services:
  redis:
    image: redis:8-alpine
    # The reusable result cache is not an authoritative store, so persistence stays off.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twocheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twocheck}
      POSTGRES_DB: ${POSTGRES_DB:-twocheck}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twocheck} -d ${POSTGRES_DB:-twocheck}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
