# Backend for an existing HAProxy that already terminates HTTPS for 2check.uz.
# Only the fragment that matters is shown; merge it into the running configuration.

frontend https_in
    # ... existing bind and certificate configuration ...
    acl host_2check hdr(host) -i 2check.uz
    use_backend twocheck if host_2check

backend twocheck
    mode http
    option forwardfor
    # The web container is bound to loopback on the VPS; adjust the port if WEB_PORT differs.
    server web 127.0.0.1:3000 check

    # HSTS is set here because HAProxy is what speaks TLS to the browser. The application also
    # sends Referrer-Policy, X-Content-Type-Options, X-Frame-Options and a content security
    # policy, so those are not repeated.
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # The application never needs the visitor's address: there is no per-client logic and the
    # scan target comes from the request body. Forwarded headers are not trusted by the API
    # (TRUST_PROXY defaults to false) and nothing downstream reads them today.

    # PRD 27.5 — readiness is what should gate traffic, not liveness.
    option httpchk
    http-check send meth GET uri /ru
