# Сервер приложения на той же ВМ, что и контейнеры.
#
# Реальная топология: HTTPS для 2check.uz терминирует HAProxy на отдельном кластере, который
# обслуживает команда инфраструктуры. Он ходит на эту ВМ по HTTP, а nginx проксирует запрос в
# контейнер web, слушающий только loopback.
#
#     браузер --HTTPS--> HAProxy (внешний кластер) --HTTP--> nginx :80 --> 127.0.0.1:3000
#
# Положить как /etc/nginx/conf.d/2check.conf

server {
    # default_server, потому что заранее неизвестно, с каким Host ходит внешний HAProxy:
    # так блок отвечает и на имя домена, и на запрос по адресу ВМ. Если на этом nginx появятся
    # другие сайты, пометку default_server нужно будет пересмотреть.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 2check.uz;

    # Адрес посетителя берём из X-Forwarded-For, но верим этому заголовку только тогда, когда
    # соединение пришло из сети внешнего HAProxy. Заголовок, который придумал сам клиент, при
    # этом отбрасывается: подставить себе чужой адрес и обойти ограничение частоты не выйдет.
    #
    # Подсеть, а не один адрес: кластер балансировщиков может отвечать с любого своего узла, а
    # клиентов в этой сети нет. Если команда инфраструктуры назовёт точный список узлов, лучше
    # перечислить их строками set_real_ip_from — доверия должно быть ровно столько, сколько нужно.
    set_real_ip_from 10.222.71.0/24;
    real_ip_header X-Forwarded-For;
    # off — брать последнюю запись цепочки, ту, что дописал сам HAProxy. Записи левее неё пришли
    # от клиента и ничем не подтверждены.
    real_ip_recursive off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Не $proxy_add_x_forwarded_for: тот дописал бы наш адрес справа от того, что прислал
        # клиент, и слева в цепочке осталась бы его выдумка. Приложение читает цепочку слева,
        # поэтому отдаём ему ровно один адрес — тот, который установил real_ip выше.
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Заголовок пробрасывается от HAProxy, а не подставляется здесь: подставить своё значение
        # значило бы утверждать про схему соединения то, чего nginx не знает.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}

# На RHEL-семействе с SELinux в Enforcing nginx по умолчанию не может подключаться к локальному
# порту и вернёт 502. Лечится один раз:
#
#     setsebool -P httpd_can_network_connect 1
#
# HSTS не задаётся здесь: его выставляет само приложение, а TLS терминирует HAProxy.
