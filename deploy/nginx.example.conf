# Сервер приложения на той же ВМ, что и контейнеры.
#
# Реальная топология: HTTPS для 2check.uz терминирует HAProxy на отдельном кластере, который
# обслуживает команда инфраструктуры. Он ходит на эту ВМ по HTTP, а nginx проксирует запрос в
# контейнер web, слушающий только loopback.
#
#     браузер --HTTPS--> HAProxy (внешний кластер) --HTTP--> nginx :80 --> 127.0.0.1:3000
#
# Положить как /etc/nginx/conf.d/2check.conf

server {
    # default_server, потому что заранее неизвестно, с каким Host ходит внешний HAProxy:
    # так блок отвечает и на имя домена, и на запрос по адресу ВМ. Если на этом nginx появятся
    # другие сайты, пометку default_server нужно будет пересмотреть.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 2check.uz;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Заголовок пробрасывается от HAProxy, а не подставляется здесь: подставить своё значение
        # значило бы утверждать про схему соединения то, чего nginx не знает.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}

# На RHEL-семействе с SELinux в Enforcing nginx по умолчанию не может подключаться к локальному
# порту и вернёт 502. Лечится один раз:
#
#     setsebool -P httpd_can_network_connect 1
#
# HSTS не задаётся здесь: его выставляет само приложение, а TLS терминирует HAProxy.
