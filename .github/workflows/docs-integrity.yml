name: Documentation / Документация

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: RU + EN · integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_docs.py
      - run: python3 scripts/build_prd.py --check
      - run: python3 scripts/test_docs.py
